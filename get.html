<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download GoStylens</title>
    <meta
      name="description"
      content="Download GoStylens on the App Store or Google Play."
    />
    <link rel="canonical" href="https://gostylens.app/get.html" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles/globals.css" />
    <!-- Fallback if edge middleware is unavailable: JS redirect -->
    <script>
      (function () {
        var APP_STORE_URL =
          "https://apps.apple.com/app/gostylens/id6760427902";
        var PLAY_STORE_URL =
          "https://play.google.com/store/apps/details?id=com.stylenslab.gostylens";
        var ua = navigator.userAgent || "";
        var isIOS =
          /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (isIOS) {
          window.location.replace(APP_STORE_URL);
          return;
        }
        if (/Android/i.test(ua)) {
          window.location.replace(PLAY_STORE_URL);
        }
      })();
    </script>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: var(--font-body);
        background:
          radial-gradient(ellipse at 50% 0%, var(--bg-alt) 0%, transparent 55%),
          linear-gradient(
            180deg,
            var(--bg) 0%,
            var(--bg-deep) 45%,
            var(--bg) 100%
          );
        color: var(--text);
      }

      .get-card {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 20px 50px rgba(var(--ink-rgb), 0.1);
      }

      .get-card h1 {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--primary);
        margin: 0 0 10px;
      }

      .get-card p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 28px;
      }

      .store-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .store-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px 20px;
        border-radius: 14px;
        text-decoration: none;
        color: #fff;
        background: var(--cta);
        transition: background 0.2s;
      }

      .store-btn:hover {
        background: var(--cta-hover);
      }

      .store-btn svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
        flex-shrink: 0;
      }

      .store-label {
        text-align: left;
        line-height: 1.2;
      }

      .store-label span {
        display: block;
        font-size: 11px;
        opacity: 0.85;
      }

      .store-label strong {
        font-size: 16px;
        font-weight: 600;
      }

      .home-link {
        display: inline-block;
        margin-top: 20px;
        color: var(--cta);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }

      .home-link:hover {
        color: var(--cta-hover);
      }
    </style>
  </head>
  <body>
    <div class="get-card">
      <h1>Get GoStylens</h1>
      <p>Choose your store to download the app.</p>
      <div class="store-buttons">
        <a
          class="store-btn"
          href="https://apps.apple.com/app/gostylens/id6760427902"
          rel="noopener"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"
            />
          </svg>
          <div class="store-label">
            <span>Download on the</span><strong>App Store</strong>
          </div>
        </a>
        <a
          class="store-btn"
          href="https://play.google.com/store/apps/details?id=com.stylenslab.gostylens"
          rel="noopener"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 01-.61-.92V2.734a1 1 0 01.609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.199l2.807 1.626a1 1 0 010 1.732l-2.807 1.627L15.206 12l2.492-2.492zM5.864 2.658L16.8 8.99l-2.302 2.302-8.634-8.634z"
            />
          </svg>
          <div class="store-label">
            <span>Get it on</span><strong>Google Play</strong>
          </div>
        </a>
      </div>
      <a class="home-link" href="/">Back to homepage</a>
    </div>
  </body>
</html>
